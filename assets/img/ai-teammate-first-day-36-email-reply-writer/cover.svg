<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="AI 본부장 대표 이미지: AI 팀원 첫 출근 ㊱ 메일 회신 초안 담당">
<title>AI 본부장 대표 이미지: AI 팀원 첫 출근 ㊱ 메일 회신 초안 담당</title>
<rect width="1200" height="630" fill="#1B2A49"/>
<rect x="0" y="0" width="16" height="630" fill="#F5A623"/>
<text x="80" y="96" font-size="34" font-weight="700" fill="#F5A623" text-anchor="start" letter-spacing="1">AI 본부장</text>
<text x="80" y="220" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start" >AI 팀원 첫 출근 ㊱ 메일 회신 초안</text>
<text x="80" y="296" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start" >담당</text>
<text x="80" y="380" font-size="30" font-weight="400" fill="#C9D1E3" text-anchor="start" >메일 답장 AI로 쓰는 법: 받은 메일과 내 메모를 넘기면 회신 초안이</text>
<text x="80" y="424" font-size="30" font-weight="400" fill="#C9D1E3" text-anchor="start" >나와요</text>
<rect x="80" y="500" width="305" height="56" rx="28" fill="#F5A623"/>
<text x="232.5" y="538" font-size="28" font-weight="700" fill="#1B2A49" text-anchor="middle" >메일 회신 초안 담당</text>
</svg>
