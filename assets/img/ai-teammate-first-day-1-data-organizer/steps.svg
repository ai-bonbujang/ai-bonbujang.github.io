<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="전과 후 단계 비교: 전 5단계, 후 3~4단계">
<title>전과 후 단계 비교: 전 5단계, 후 3~4단계</title>
<rect width="1200" height="710" fill="#F4F6FA"/>
<text x="60" y="70" font-size="36" font-weight="700" fill="#1B2A49" text-anchor="start" >전과 후</text>
<text x="60" y="108" font-size="22" font-weight="400" fill="#5B6475" text-anchor="start" >같은 일을 하는 데 거치는 단계</text>
<rect x="60" y="122" width="500" height="12" rx="6" fill="#5B6475"/>
<rect x="640" y="122" width="500" height="12" rx="6" fill="#F5A623"/>
<text x="60" y="170" font-size="28" font-weight="700" fill="#5B6475" text-anchor="start" >전 · 5단계</text>
<text x="640" y="170" font-size="28" font-weight="700" fill="#1B2A49" text-anchor="start" >후 · 3~4단계</text>
<g opacity="1">
<rect x="60" y="210" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#5B6475" stroke-width="2"/>
<circle cx="96" cy="242" r="20" fill="#5B6475"/>
<text x="96" y="250" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text>
<text x="132" y="250" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >메모 읽기</text>
</g>
<g opacity="1">
<rect x="60" y="294" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#5B6475" stroke-width="2"/>
<circle cx="96" cy="326" r="20" fill="#5B6475"/>
<text x="96" y="334" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text>
<text x="132" y="334" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >결정·할 일 표시</text>
</g>
<g opacity="1">
<rect x="60" y="378" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#5B6475" stroke-width="2"/>
<circle cx="96" cy="410" r="20" fill="#5B6475"/>
<text x="96" y="418" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="132" y="418" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >담당자·기한 확인</text>
</g>
<g opacity="0.38">
<rect x="60" y="462" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#5B6475" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="96" cy="494" r="20" fill="#5B6475"/>
<text x="96" y="502" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text>
<text x="132" y="502" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >표로 옮기기</text>
</g>
<text x="540" y="501" font-size="20" font-weight="700" fill="#5B6475" text-anchor="end" >후에는 빠져요</text>
<g opacity="1">
<rect x="60" y="546" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#5B6475" stroke-width="2"/>
<circle cx="96" cy="578" r="20" fill="#5B6475"/>
<text x="96" y="586" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >5</text>
<text x="132" y="586" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >빠진 것 다시 확인</text>
</g>
<rect x="640" y="210" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#1B2A49" stroke-width="3"/>
<circle cx="676" cy="242" r="20" fill="#1B2A49"/>
<text x="676" y="250" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text>
<text x="712" y="250" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >메모 넘기기</text>
<rect x="640" y="294" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#1B2A49" stroke-width="3"/>
<circle cx="676" cy="326" r="20" fill="#1B2A49"/>
<text x="676" y="334" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text>
<text x="712" y="334" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >지시 말하기</text>
<rect x="640" y="378" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#1B2A49" stroke-width="3"/>
<circle cx="676" cy="410" r="20" fill="#1B2A49"/>
<text x="676" y="418" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="712" y="418" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >결과와 원본 대조</text>
<rect x="640" y="462" width="500" height="64" rx="14" fill="#FFFFFF" stroke="#1B2A49" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="676" cy="494" r="20" fill="#1B2A49"/>
<text x="676" y="502" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text>
<text x="712" y="502" font-size="26" font-weight="400" fill="#1B2A49" text-anchor="start" >필요하면 고쳐 달라고 하기</text>
<text x="640" y="670" font-size="26" font-weight="700" fill="#1B2A49" text-anchor="start" >AI 처리 9~10초</text>
<text x="60" y="670" font-size="20" font-weight="400" fill="#5B6475" text-anchor="start" >단계 수는 작업을 나눠 센 값이에요 · 사례는 가상이에요</text>
</svg>
