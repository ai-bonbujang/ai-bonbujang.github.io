<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="AI 본부장 대표 이미지: AI 팀원 첫 출근 ⑫ 고객 문의 답장 담당">
<title>AI 본부장 대표 이미지: AI 팀원 첫 출근 ⑫ 고객 문의 답장 담당</title>
<rect width="1200" height="630" fill="#1B2A49"/>
<rect x="0" y="0" width="16" height="630" fill="#F5A623"/>
<text x="80" y="96" font-size="34" font-weight="700" fill="#F5A623" text-anchor="start" letter-spacing="1">AI 본부장</text>
<text x="80" y="220" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start" >AI 팀원 첫 출근 ⑫ 고객 문의 답장</text>
