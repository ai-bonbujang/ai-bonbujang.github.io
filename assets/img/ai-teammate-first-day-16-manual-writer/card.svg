<svg xmlns="http://www.w3.org/2000/svg" width="900" height="728" viewBox="0 0 900 728" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="인사 카드: 업무 매뉴얼 담당 (AI)">
<title>인사 카드: 업무 매뉴얼 담당 (AI)</title>
