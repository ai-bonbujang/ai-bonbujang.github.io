<text x="80" y="304" font-size="30" font-weight="400" fill="#C9D1E3" text-anchor="start" >흩어진 작업 메모를 단계별 매뉴얼로 바꾸고 빠진 단계를 표시해 달라고</text>
<text x="80" y="348" font-size="30" font-weight="400" fill="#C9D1E3" text-anchor="start" >맡겨 봤어요</text>
<rect x="80" y="500" width="269" height="56" rx="28" fill="#F5A623"/>
<text x="214.5" y="538" font-size="28" font-weight="700" fill="#1B2A49" text-anchor="middle" >업무 매뉴얼 담당</text>
