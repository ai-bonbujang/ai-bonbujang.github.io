<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="AI 본부장 대표 이미지: AI 팀원 첫 출근 ⑯ 업무 매뉴얼 담당">
